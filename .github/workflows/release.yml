# Выпуск версии пакета. Срабатывает при каждом изменении в main (и при отправке тега v*):
# если релиза с версией из package.json ещё нет, собирает библиотеку, создаёт тег vX.Y.Z
# и выкладывает архив vscm-ui-X.Y.Z.tgz в релиз на GitHub. Если релиз уже есть, ничего не делает.
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Нужен ли новый релиз
        id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $V в package.json"; exit 1
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Релиз v$V уже есть, выпускать нечего"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - if: steps.v.outputs.skip == 'false'
        run: npm ci
      - if: steps.v.outputs.skip == 'false'
        run: npm run typecheck
      - if: steps.v.outputs.skip == 'false'
        run: npm run package
      - if: steps.v.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.v.outputs.version }}
          files: vscm-ui-*.tgz
          body: |
            Установка:
            ```
            npm install https://github.com/${{ github.repository }}/releases/download/v${{ steps.v.outputs.version }}/vscm-ui-${{ steps.v.outputs.version }}.tgz
            ```
            Что изменилось — в CHANGELOG.md.
